version: "3.3"

services:

  admin-iam-service:
    build:
      context: .
      dockerfile: development.Dockerfile
    image: microservices-workshop/admin-iam-service:dev
    restart: on-failure
    environment: &admin-env
      DB_HOST: 10.33.30.5
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ExZ3naPw@32!perts
      DB_NAME: eparts_core
      COTE_DISCOVERY_REDIS_HOST: 10.33.30.5
      COTE_DISCOVERY_REDIS_PORT: 6379
    volumes:
      - type: bind
        source: ./microservices/admin/iam-service
        target: C:/app/src
      - type: bind
        source: ./libs
        target: C:/app/libs
      - type: bind
        source: ./assets
        target: C:/app/assets
      - type: bind
        source: ./logs
        target: C:/app/logs

